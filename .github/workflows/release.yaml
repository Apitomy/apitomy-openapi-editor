name: Release
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'
    outputs:
      release-version: ${{ steps.versions.outputs.release-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.0

      - name: Configure Git
        run: |
          git config user.name "apitomy-ci"
          git config user.email "apitomy.ci@gmail.com"


      - name: Compute Release Version
        id: versions
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "release-version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $CURRENT_VERSION"


      - name: Build and Verify
        run: |
          npm install
          npm run lint
          npm run build


      - name: Create GitHub Release
        run: |
          gh release create "v${{ steps.versions.outputs.release-version }}" \
            --title "${{ steps.versions.outputs.release-version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}


  npm-publish:
    needs: release
    uses: ./.github/workflows/npm-publish.yaml
    with:
      release-version: ${{ needs.release.outputs.release-version }}
      quiet: true
    secrets: inherit


  finalize:
    needs: [release, npm-publish]
    runs-on: ubuntu-latest
    if: always() && needs.release.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.0

      - name: Configure Git
        run: |
          git config user.name "apitomy-ci"
          git config user.email "apitomy.ci@gmail.com"
          git pull


      - name: Bump to next patch version
        run: |
          npm version patch --no-git-tag-version
          NEXT_VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "Automated version update: $NEXT_VERSION"
          git push


      - name: Check Publishing Results
        run: |
          echo "Release workflow completed"
          echo "NPM publish status: ${{ needs.npm-publish.result }}"
          if [[ "${{ needs.npm-publish.result }}" != "success" ]]; then
            echo "WARNING: NPM publish failed. You can retry it manually:"
            echo "  https://github.com/${{ github.repository }}/actions/workflows/npm-publish.yaml"
          fi


  # Slack: the outcome of the whole release, publishes included. Success to
  # the general channel, a failure to the important one, mentioning whoever
  # ran it. A failed publish can be re-run on its own from its workflow.
  notify:
    name: Notify
    needs: [release, npm-publish, finalize]
    if: ${{ !cancelled() && github.repository_owner == 'Apitomy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify
        uses: Apicurio/apicurio-github-actions/notify-slack@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2.4.0
        with:
          level: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'important' || 'general' }}
          text: "${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && format(':x: {0}: release {1} failed (release {2}, npm-publish {3}, finalize {4})', github.repository, needs.release.outputs.release-version, needs.release.result, needs.npm-publish.result, needs.finalize.result) || format(':rocket: {0} {1} released', github.repository, needs.release.outputs.release-version) }}"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && github.actor || '' }}
          machine-users: apitomy-ci
          user-map: ${{ secrets.SLACK_USER_MAP }}
          important-webhook: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}
          general-webhook: ${{ secrets.SLACK_GENERAL_NOTIFICATION_WEBHOOK }}
